name: Importar clases del profesor

on:
  push:
    paths:
      - '.github/workflows/importar-clases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio personal
        uses: actions/checkout@v4

      - name: Clonar repositorio del profesor
        run: git clone --depth 1 https://github.com/asennies21/aw2-cna-2026s2.git profesor

      - name: Copiar clase1, clase2 y clase3
        run: |
          rsync -av --exclude='node_modules' profesor/clase1/ clase1/
          rsync -av --exclude='node_modules' profesor/clase2/ clase2/
          rsync -av --exclude='node_modules' profesor/clase3/ clase3/
          rm -rf profesor

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clase1 clase2 clase3
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Copiar material de clases 1, 2 y 3"
            git push
          fi
